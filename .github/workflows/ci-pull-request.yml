name: CI – Pull Request

on:
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  #  Build & Unit Tests
  # ──────────────────────────────────────────────
  unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests
        run: >
          dotnet test "HostelOps-API Unit Tests/HostelOps-API Unit Tests.csproj"
          --no-build
          --configuration Release
          --logger "trx;LogFileName=unit-test-results.trx"
          --results-directory ./TestResults/Unit
          --collect:"XPlat Code Coverage"

      - name: Publish Unit Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Test Report
          path: TestResults/Unit/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload Unit Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: TestResults/Unit/**/coverage.cobertura.xml
          retention-days: 7

  # ──────────────────────────────────────────────
  #  Integration Tests
  # ──────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests          # only run if unit tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run Integration Tests
        run: >
          dotnet test "HostelOps-API Integration Tests/HostelOps-API Integration Tests.csproj"
          --no-build
          --configuration Release
          --logger "trx;LogFileName=integration-test-results.trx"
          --results-directory ./TestResults/Integration
          --collect:"XPlat Code Coverage"
        env:
          ASPNETCORE_ENVIRONMENT: Test

      - name: Publish Integration Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Test Report
          path: TestResults/Integration/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload Integration Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-coverage
          path: TestResults/Integration/**/coverage.cobertura.xml
          retention-days: 7

  # ──────────────────────────────────────────────
  #  Coverage Summary (optional gate)
  # ──────────────────────────────────────────────
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()

    steps:
      - name: Download Unit Coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-coverage
          path: coverage/unit

      - name: Download Integration Coverage
        uses: actions/download-artifact@v4
        with:
          name: integration-coverage
          path: coverage/integration

      - name: Generate Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: 'coverage/**/*.xml'
          badge: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: '60 80'   # warn at <60%, fail at <80%

      - name: Add Coverage to PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
